<div
  class="dpad"
  role="group"
  aria-label="Tetris controls"
>
  <button
    type="button"
    class="dpad-button"
    aria-label="Rotate piece"
    (click)="control('rotate')"
  >
    ⟳
  </button>

  <div class="dpad-middle-row">
    <button
      type="button"
      class="dpad-button"
      aria-label="Move left"
      (click)="control('left')"
    >
      ◀
    </button>

    <button
      type="button"
      class="dpad-button"
      aria-label="Move down"
      (click)="control('down')"
    >
      ▼
    </button>

    <button
      type="button"
      class="dpad-button"
      aria-label="Move right"
      (click)="control('right')"
    >
      ▶
    </button>
  </div>

  <button
    type="button"
    class="dpad-button drop-button"
    aria-label="Drop piece"
    (click)="control('drop')"
  >
    Drop
  </button>
</div>
