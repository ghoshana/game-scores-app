<section class="tetris-container">
  <h1>Tetris</h1>

  <p class="score">
    Score: {{ score }}
  </p>

  <div class="board-wrapper">
    <canvas
      #board
      width="250"
      height="500"
      aria-label="Tetris game board">
    </canvas>

   @if (gameOver) {
  <div class="game-over-overlay">
    <div class="game-over-box">
      <h2>Game Over</h2>

      <p>
        Final score:
        <strong>{{ score }}</strong>
      </p>

      <div class="game-over-actions">
        <button
          type="button"
          class="restart-button"
          (click)="restart()">
          Restart
        </button>

        <a
          routerLink="/"
          class="home-button">
          Go to Home
        </a>
      </div>
    </div>
  </div>
}
  </div>

  <div class="instructions">
    <p>← → Move</p>
    <p>↓ Move down</p>
    <p>↑ Rotate</p>
    <p>Space: hard drop</p>
  </div>
</section>
