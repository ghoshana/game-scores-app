<div class="snake-page">
  <div class="background-snakes" aria-hidden="true">
    <svg class="bg-snake snake-left-right" viewBox="0 0 260 80">
      <defs>
        <linearGradient id="gradLR" gradientUnits="userSpaceOnUse" x1="12" y1="40" x2="234" y2="40">
          <stop offset="0" stop-color="#a7f3b0" />
          <stop offset="0.5" stop-color="#38b000" />
          <stop offset="1" stop-color="#1b6b2f" />
        </linearGradient>
      </defs>
      <path class="snake-body" stroke="url(#gradLR)" d="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40">
        <animate attributeName="d" dur="2s" repeatCount="indefinite"
          values="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40;
                  M12 40 C46 72, 78 8, 110 40 S176 72, 214 40;
                  M12 40 C46 8, 78 72, 110 40 S176 8, 214 40" />
      </path>
      <path class="snake-scales" d="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40">
        <animate attributeName="d" dur="2s" repeatCount="indefinite"
          values="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40;
                  M12 40 C46 72, 78 8, 110 40 S176 72, 214 40;
                  M12 40 C46 8, 78 72, 110 40 S176 8, 214 40" />
      </path>
      <path class="snake-gloss" d="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40">
        <animate attributeName="d" dur="2s" repeatCount="indefinite"
          values="M12 40 C46 8, 78 72, 110 40 S176 8, 214 40;
                  M12 40 C46 72, 78 8, 110 40 S176 72, 214 40;
                  M12 40 C46 8, 78 72, 110 40 S176 8, 214 40" />
      </path>
      <ellipse class="snake-head-shape" cx="215" cy="40" rx="17" ry="13" fill="url(#gradLR)" />
      <path class="snake-tongue" d="M232 40 L246 40 M246 40 L252 35 M246 40 L252 45" />
      <circle class="eye-white" cx="219" cy="34" r="2.6" />
      <circle class="eye-white" cx="219" cy="46" r="2.6" />
      <ellipse class="eye-slit" cx="219" cy="34" rx="0.8" ry="2" />
      <ellipse class="eye-slit" cx="219" cy="46" rx="0.8" ry="2" />
    </svg>

    <svg class="bg-snake snake-top-bottom" viewBox="0 0 80 260">
      <defs>
        <linearGradient id="gradTB" gradientUnits="userSpaceOnUse" x1="40" y1="12" x2="40" y2="234">
          <stop offset="0" stop-color="#a7f3b0" />
          <stop offset="0.5" stop-color="#38b000" />
          <stop offset="1" stop-color="#1b6b2f" />
        </linearGradient>
      </defs>
      <path class="snake-body" stroke="url(#gradTB)" d="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214;
                  M40 12 C72 46, 8 78, 40 112 S72 176, 40 214;
                  M40 12 C8 46, 72 78, 40 112 S8 176, 40 214" />
      </path>
      <path class="snake-scales" d="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214;
                  M40 12 C72 46, 8 78, 40 112 S72 176, 40 214;
                  M40 12 C8 46, 72 78, 40 112 S8 176, 40 214" />
      </path>
      <path class="snake-gloss" d="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M40 12 C8 46, 72 78, 40 112 S8 176, 40 214;
                  M40 12 C72 46, 8 78, 40 112 S72 176, 40 214;
                  M40 12 C8 46, 72 78, 40 112 S8 176, 40 214" />
      </path>
      <ellipse class="snake-head-shape" cx="40" cy="215" rx="13" ry="17" fill="url(#gradTB)" />
      <path class="snake-tongue" d="M40 232 L40 246 M40 246 L35 252 M40 246 L45 252" />
      <circle class="eye-white" cx="34" cy="211" r="2.6" />
      <circle class="eye-white" cx="46" cy="211" r="2.6" />
      <ellipse class="eye-slit" cx="34" cy="211" rx="2" ry="0.8" />
      <ellipse class="eye-slit" cx="46" cy="211" rx="2" ry="0.8" />
    </svg>

    <svg class="bg-snake snake-bottom-top" viewBox="0 -26 80 260">
      <defs>
        <linearGradient id="gradBT" gradientUnits="userSpaceOnUse" x1="40" y1="214" x2="40" y2="14">
          <stop offset="0" stop-color="#a7f3b0" />
          <stop offset="0.5" stop-color="#38b000" />
          <stop offset="1" stop-color="#1b6b2f" />
        </linearGradient>
      </defs>
      <path class="snake-body" stroke="url(#gradBT)" d="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14;
                  M40 214 C72 180, 8 150, 40 116 S72 60, 40 14;
                  M40 214 C8 180, 72 150, 40 116 S8 60, 40 14" />
      </path>
      <path class="snake-scales" d="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14;
                  M40 214 C72 180, 8 150, 40 116 S72 60, 40 14;
                  M40 214 C8 180, 72 150, 40 116 S8 60, 40 14" />
      </path>
      <path class="snake-gloss" d="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M40 214 C8 180, 72 150, 40 116 S8 60, 40 14;
                  M40 214 C72 180, 8 150, 40 116 S72 60, 40 14;
                  M40 214 C8 180, 72 150, 40 116 S8 60, 40 14" />
      </path>
      <ellipse class="snake-head-shape" cx="40" cy="13" rx="13" ry="17" fill="url(#gradBT)" />
      <path class="snake-tongue" d="M40 -4 L40 -18 M40 -18 L35 -24 M40 -18 L45 -24" />
      <circle class="eye-white" cx="34" cy="17" r="2.6" />
      <circle class="eye-white" cx="46" cy="17" r="2.6" />
      <ellipse class="eye-slit" cx="34" cy="17" rx="2" ry="0.8" />
      <ellipse class="eye-slit" cx="46" cy="17" rx="2" ry="0.8" />
    </svg>

    <svg class="bg-snake snake-diagonal" viewBox="0 0 260 130">
      <defs>
        <linearGradient id="gradDiag" gradientUnits="userSpaceOnUse" x1="12" y1="72" x2="234" y2="78">
          <stop offset="0" stop-color="#a7f3b0" />
          <stop offset="0.5" stop-color="#38b000" />
          <stop offset="1" stop-color="#1b6b2f" />
        </linearGradient>
      </defs>
      <path class="snake-body" stroke="url(#gradDiag)" d="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78">
        <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
          values="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78;
                  M12 72 C52 112, 92 10, 132 56 S186 108, 214 78;
                  M12 72 C52 10, 92 112, 132 56 S186 8, 214 78" />
      </path>
      <path class="snake-scales" d="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78">
        <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
          values="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78;
                  M12 72 C52 112, 92 10, 132 56 S186 108, 214 78;
                  M12 72 C52 10, 92 112, 132 56 S186 8, 214 78" />
      </path>
      <path class="snake-gloss" d="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78">
        <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
          values="M12 72 C52 10, 92 112, 132 56 S186 8, 214 78;
                  M12 72 C52 112, 92 10, 132 56 S186 108, 214 78;
                  M12 72 C52 10, 92 112, 132 56 S186 8, 214 78" />
      </path>
      <ellipse class="snake-head-shape" cx="216" cy="78" rx="17" ry="13" fill="url(#gradDiag)" />
      <path class="snake-tongue" d="M233 78 L247 77 M247 77 L253 72 M247 77 L252 82" />
      <circle class="eye-white" cx="220" cy="72" r="2.6" />
      <circle class="eye-white" cx="220" cy="84" r="2.6" />
      <ellipse class="eye-slit" cx="220" cy="72" rx="0.8" ry="2" />
      <ellipse class="eye-slit" cx="220" cy="84" rx="0.8" ry="2" />
    </svg>
  </div>

  <section class="snake-container">
    <h1>Snake</h1>

    <p class="score">Score: {{ score }}</p>

    <button
      type="button"
      class="sound-button"
      (click)="toggleSound()"
      [attr.aria-label]="soundEnabled ? 'Mute game sounds' : 'Enable game sounds'">
      {{ soundEnabled ? '🔊 Sound On' : '🔇 Sound Off' }}
    </button>

    <div class="board-wrapper">
      <canvas #board width="400" height="400" aria-label="Snake game board"></canvas>

      @if (gameOver) {
        <div class="game-over-overlay">
          <div class="game-over-box">
            <h2>Game Over</h2>
            <p>Final score: <strong>{{ score }}</strong></p>

            @if (savingScore) {
              <p class="save-status">Saving score...</p>
            }
            @if (scoreSaved) {
              <p class="save-success">Score saved successfully.</p>
            }
            @if (scoreSaveError) {
              <p class="save-error">{{ scoreSaveError }}</p>
            }

            <div class="game-over-actions">
              <button type="button" class="restart-button" (click)="restart()">Restart</button>
              <a routerLink="/" class="home-button">Go to Home</a>
            </div>
          </div>
        </div>
      }
    </div>

    <p class="instructions">
      Use the arrow keys, swipe, or the buttons below to move the snake.
    </p>

    <div class="dpad" role="group" aria-label="Snake movement controls">
      <button type="button" class="dpad-button" aria-label="Move up" (click)="move(0, -1)">▲</button>

      <div class="dpad-middle-row">
        <button type="button" class="dpad-button" aria-label="Move left" (click)="move(-1, 0)">◀</button>
        <button type="button" class="dpad-button" aria-label="Move right" (click)="move(1, 0)">▶</button>
      </div>

      <button type="button" class="dpad-button" aria-label="Move down" (click)="move(0, 1)">▼</button>
    </div>
  </section>
</div>
