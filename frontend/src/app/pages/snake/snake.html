<section class="snake-container">
  <h1>Snake</h1>

  <p class="score">
    Score: {{ score }}
  </p>

  <div class="board-wrapper">
    <canvas
      #board
      width="400"
      height="400"
      aria-label="Snake game board">
    </canvas>

    @if (gameOver) {
      <div class="game-over-overlay">
        <div class="game-over-box">
          <h2>Game Over</h2>

          <p>
            Final score:
            <strong>{{ score }}</strong>
          </p>

          <button
            type="button"
            (click)="restart()">
            Restart
          </button>
        </div>
      </div>
    }
  </div>

  <p class="instructions">
    Use the arrow keys to move the snake.
  </p>
</section>
